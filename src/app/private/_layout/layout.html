<div class="layout-private">
    <app-header />
    <div class="layout-private__content-container">
        <div class="layout-private__menu">
            <form class="layout-private__genres" [formGroup]="form">
                <app-search-input formArrayName="name" />

                <h3>Жанры</h3>
                <select formControlName="genre" id="genres">
                    @for (gener of genres; track gener.id) {
                        <option [value]="gener.id">{{ gener.name }}</option>
                    }
                </select>
            </form>
        </div>
        <div class="layout-private__page">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
