@let type = mode() ? 'password' : 'text';

<div class="form__control">
    <div class="form__control-prefix">
        <img [src]="Icons.Lock" width="30" height="30" alt="icon" />
    </div>

    <input
        class="form__control-element"
        [type]="type"
        [placeholder]="placeholder()"
        [disabled]="disabled"
    />

    <div class="form__control-postfix">
        <button class="form__control-button" type="button" (click)="toggleMode()">
            @if (mode()) {
                <img [src]="Icons.EyeClosed" width="30" height="30" alt="icon" />
            } @else {
                <img [src]="Icons.EyeOpened" width="30" height="30" alt="icon" />
            }
        </button>
    </div>
</div>
