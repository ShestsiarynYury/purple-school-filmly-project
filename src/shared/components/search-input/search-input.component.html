<div class="form__control">
    <div class="form__icon">
        <img ngSrc="iconUrl()" width="30" height="30" alt="search-icon" />
    </div>
    <input
        class="form__input"
        [type]="type()"
        placeholder="placeholder"
        [disabled]="false"
        [value]="value()"
        (input)="onInput($any($event.target).value)"
    />
</div>
